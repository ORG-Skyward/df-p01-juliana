name: Despliegue de Calculadora y Django

on:
  push:
    branches: [ "main", "feature/juliana" ]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # CAJÓN 1: Compila y genera tanto la Calculadora como el HTML de Django
  desplegar-calculadora:
    environment:
      name: github-pages-calculadora
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
    - name: Obtener código del repositorio
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Instalar Dependencias
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; else pip install django; fi

    - name: Generar Calculadora Principal
      run: python src/suma.py

    - name: Generar Módulo Django en public/django/index.html
      run: |
        export PYTHONPATH=$PYTHONPATH:.
        python src/generar_django.py

    - name: Configurar GitHub Pages
      uses: actions/configure-pages@v4

    - name: Cargar Artefactos Web
      uses: actions/upload-pages-artifact@v3
      with:
        path: 'public'

    - name: Desplegar en GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4

  # CAJÓN 2: Enlace directo a la ruta desplegada
  desplegar-django:
    needs: desplegar-calculadora
    environment:
      name: github-pages-django
      url: https://org-skyward.github.io/df-p01-juliana/django/
    runs-on: ubuntu-latest

    steps:
    - name: Confirmar despliegue de Django
      run: |
        echo "Módulo Django generado e integrado en GitHub Pages."
         