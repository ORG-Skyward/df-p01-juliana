name: Despliegue de Calculadora y Django

on:
  push:
    branches: [ "main", "feature/juliana" ]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # CAJÓN 1: Mantiene el enlace de la Calculadora Base intacto
  desplegar-calculadora:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
    - name: Obtener código del repositorio
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Generar Calculadora Principal
      run: python src/suma.py

    - name: Configurar GitHub Pages
      uses: actions/configure-pages@v4

    - name: Cargar Artefactos Web
      uses: actions/upload-pages-artifact@v3
      with:
        path: 'public'

    - name: Desplegar en GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4


  # CAJÓN 2: Segundo cajón exclusivo para el link del Módulo Django
  desplegar-django:
    needs: desplegar-calculadora
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}django/
    runs-on: ubuntu-latest

    steps:
    - name: Notificar estado de Django
      run: |
        echo "Módulo de Django activo y vinculado al entorno de producción."

         