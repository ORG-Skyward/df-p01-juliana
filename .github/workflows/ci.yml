name: Despliegue de Calculadora y Django

on:
  push:
    branches: [ "main", "feature/juliana" ]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
    - name: Obtener código del repositorio
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Instalar dependencias de Django
      run: |
        python -m pip install --upgrade pip
        pip install django

    - name: Generar Calculadora Base
      run: python src/suma.py

    - name: Generar Módulo Django
      run: |
        cd src
        python -c "import os, django; os.environ.setdefault('DJANGO_SETTINGS_MODULE', 'mi_proyecto.settings'); django.setup(); import generar_django"

    - name: Configurar GitHub Pages
      uses: actions/configure-pages@v4

    - name: Cargar artefactos web
      uses: actions/upload-pages-artifact@v3
      with:
        path: 'public'

    - name: Desplegar en GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4

    - name: Mostrar Enlaces de Despliegue
      run: |
        echo "========================================="
        echo "ENLACES GENERADOS CON ÉXITO:"
        echo "Enlace 1 (Calculadora Base): ${{ steps.deployment.outputs.page_url }}"
        echo "Enlace 2 (App Django): ${{ steps.deployment.outputs.page_url }}django/"
        echo "========================================="
         