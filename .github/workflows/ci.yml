name: Despliegue de Calculadora y Django

on:
  push:
    branches: [ "main", "feature/juliana" ]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # CAJÓN 1: Genera y despliega la Calculadora en GitHub Pages
  desplegar-calculadora:
    environment:
      name: github-pages-calculadora
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
    - name: Obtener código del repositorio
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Generar Calculadora Principal
      run: python src/suma.py

    - name: Configurar GitHub Pages
      uses: actions/configure-pages@v4

    - name: Cargar Artefactos Web
      uses: actions/upload-pages-artifact@v3
      with:
        path: 'public'

    - name: Desplegar en GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4

  # CAJÓN 2: Conecta y muestra el link de la Calculadora/Django en Render
  desplegar-django:
    needs: desplegar-calculadora
    environment:
      name: render-django
      url: https://org-skyward.github.io/df-p01-juliana/django/
    runs-on: ubuntu-latest

    steps:
    - name: Notificar estado de Django
      run: |
        echo "Modulo de Django configurado y activo."