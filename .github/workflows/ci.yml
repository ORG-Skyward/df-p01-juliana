name: Despliegue de Calculadora y Django

on:
  push:
    branches: [ "main", "feature/juliana" ]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # JOB 1: Construye la calculadora base y el modulo Django juntos
  compilar-sitio:
    runs-on: ubuntu-latest
    steps:
    - name: Obtener código del repositorio
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Instalar Django
      run: |
        python -m pip install --upgrade pip
        pip install django

    - name: Generar Calculadora Principal
      run: python src/suma.py

    - name: Generar Módulo Django
      run: |
        cd src
        python -c "import os, django; os.environ.setdefault('DJANGO_SETTINGS_MODULE', 'mi_proyecto.settings'); django.setup(); import generar_django"

    - name: Configurar GitHub Pages
      uses: actions/configure-pages@v4

    - name: Cargar Artefactos Web
      uses: actions/upload-pages-artifact@v3
      with:
        path: 'public'


  # CAJÓN 1: Despliega todo el sitio y muestra el link base
  desplegar-calculadora:
    needs: compilar-sitio
    environment:
      name: github-pages-calculadora
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
    - name: Desplegar en GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4


  # CAJÓN 2: Muestra el enlace directo a la sección Django sin re-desplegar
  desplegar-django:
    needs: desplegar-calculadora
    environment:
      name: github-pages-django
      url: https://org-skyward.github.io/df-p01-juliana/django/
    runs-on: ubuntu-latest

    steps:
    - name: Registrar enlace de Django
      run: |
        echo "Módulo de Django disponible en https://org-skyward.github.io/df-p01-juliana/django/"
        